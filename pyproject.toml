[project]
name = "astemia"
version = "0.1.0"
description = "ASTEMIA Intelligence Health Platform: CEDA reference implementation (AMS-002 section 10)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.165,<0.166",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1.9,<2.2",
    "mysql-connector-python>=26.10,<26.11",
    "alembic>=1.20,<1.21",
    "pyjwt>=2.15,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "httpx2>=2.16,<3",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
]
tools = ["olefile>=0.47"]

[project.scripts]
astemia = "astemia.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astemia"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "TID"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/astemia/migrations/**" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# CEDA 10.2: the domain layer is pure. Enforced for src/astemia/domain via the import-boundary test.

[tool.mypy]
python_version = "3.14"
strict = true
plugins = []
mypy_path = "src"
packages = ["astemia"]

[[tool.mypy.overrides]]
module = ["mysql.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: needs a MySQL 26.10 server (ASTEMIA_TEST_DATABASE_URL)",
]
